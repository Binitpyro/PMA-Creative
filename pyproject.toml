[project]
name = "pma-creative-xprize"
version = "0.1.0"
description = "PMA Creative Houdini Assistant plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14.0",
    "keyring>=24.0",
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "PySide6>=6.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["houdini_plugin/pma_houdini"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "houdini_plugin"]
